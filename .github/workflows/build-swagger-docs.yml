name: Build Swagger Docs

on:
  push:
    branches: ["main"]       # main에 push될 때 => build + deploy
  pull_request:
    branches: ["main"]       # PR 열릴 때 => build + preview 배포
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  APP_MODULE: app.main:app
  SUPPRESS_VARIABLE_NOT_ASSIGNED_ERROR: "true"

jobs:
  build:
    # PR closed(정리)일 땐 build 생략 (미리보기는 GitHub이 자동 종료 처리)
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export openapi.json (no server)
        run: |
          python scripts/export_openapi.py $APP_MODULE

      # ===== Main 배포 산출물 준비 =====
      - name: Prepare Swagger UI under / (main site)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -o /tmp/swagger-ui.zip
          unzip -q /tmp/swagger-ui.zip -d /tmp
          cp -r /tmp/swagger-ui-master/dist/* site/
          rm -rf /tmp/swagger-ui-master /tmp/swagger-ui.zip
          cat > site/swagger-initializer.js << 'EOF'
          window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: "./openapi.json",
              dom_id: '#swagger-ui',
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: "StandaloneLayout"
            });
          };
          EOF
          cp openapi.json site/openapi.json

      # ===== PR 미리보기 산출물 준비 =====
      - name: Prepare PR preview (root)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.action != 'closed'
        run: |
          PREVIEW_DIR="preview"
          mkdir -p "$PREVIEW_DIR"
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -o /tmp/swagger-ui.zip
          unzip -q /tmp/swagger-ui.zip -d /tmp
          cp -r /tmp/swagger-ui-master/dist/* "$PREVIEW_DIR"/
          rm -rf /tmp/swagger-ui-master /tmp/swagger-ui.zip
          cat > "$PREVIEW_DIR/swagger-initializer.js" << 'EOF'
          window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: "./openapi.json",
              dom_id: '#swagger-ui',
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: "StandaloneLayout"
            });
          };
          EOF
          cp openapi.json "$PREVIEW_DIR/openapi.json"

      # ===== 아티팩트 업로드 (main) =====
      - name: Upload Pages artifact (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # ===== 아티팩트 업로드 (PR) =====
      - name: Upload Pages artifact (PR preview)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.action != 'closed'
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview

  deploy:
    # push(main) 또는 PR(미리보기)일 때 배포 실행
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.action != 'closed')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
