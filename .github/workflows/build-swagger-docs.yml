name: Build Swagger Docs

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  APP_MODULE: app.main:app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export openapi.json (no server)
        run: python scripts/export_openapi.py $APP_MODULE

      - name: Prepare Swagger UI under /docs
        run: |
          mkdir -p docs/docs
          cd docs/docs
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -o swagger-ui.zip
          unzip -q swagger-ui.zip
          cp -r swagger-ui-master/dist/* .
          rm -rf swagger-ui-master swagger-ui.zip
          sed -i 's|url: "https://petstore.swagger.io/v2/swagger.json"|url: "openapi.json"|' index.html
          cd ../..
          cp openapi.json docs/docs/openapi.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
