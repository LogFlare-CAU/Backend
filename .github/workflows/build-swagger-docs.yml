name: Build Swagger Docs

on:
  push:
    branches: ["main"]  # main에 merge(=push)될 때만 실행

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 충돌 방지(새 빌드가 오면 이전 배포를 취소)
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  APP_MODULE: app.main:app  # <- FastAPI 앱 모듈 경로에 맞게 수정

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"              # pip 캐시 활성화
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export openapi.json (no server)
        run: |
          python scripts/export_openapi.py $APP_MODULE

      - name: Prepare Swagger UI under /docs
        run: |
          # 1) Swagger UI 정적 파일 받기
          mkdir -p docs/docs
          cd docs/docs
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -o swagger-ui.zip
          unzip -q swagger-ui.zip
          cp -r swagger-ui-master/dist/* .
          rm -rf swagger-ui-master swagger-ui.zip
      
          # 2) swagger-initializer.js를 우리가 원하는 설정으로 덮어쓰기
          cat > swagger-initializer.js << 'EOF'
          window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: "./openapi.json",
              dom_id: '#swagger-ui',
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: "StandaloneLayout"
            });
          };
          EOF
      
          # 3) 교체 검증 (없으면 실패)
          grep -q "./openapi.json" swagger-initializer.js || (echo "initializer 교체 실패" && exit 1)
      
          # 4) 스키마 파일 배치
          cd ../..
          cp openapi.json docs/docs/openapi.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
