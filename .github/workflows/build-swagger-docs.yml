name: Build Swagger Docs (gh-pages branch)

on:
  push:
    branches: ["main"]       # main에 push될 때 => build + deploy(gh-pages로 푸시)
  pull_request:
    branches: ["main"]       # PR 열릴 때 => build + preview를 gh-pages/docs/pr/<num>로 푸시
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  APP_MODULE: app.main:app
  SUPPRESS_VARIABLE_NOT_ASSIGNED_ERROR: "true"

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export openapi.json (no server)
        run: |
          python scripts/export_openapi.py $APP_MODULE

      # ===== 메인 사이트(루트)에 올릴 정식 문서 =====
      - name: Prepare Swagger UI (main site)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -o /tmp/swagger-ui.zip
          unzip -q /tmp/swagger-ui.zip -d /tmp
          cp -r /tmp/swagger-ui-master/dist/* site/
          rm -rf /tmp/swagger-ui-master /tmp/swagger-ui.zip
          cat > site/swagger-initializer.js << 'EOF'
          window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: "./openapi.json",
              dom_id: '#swagger-ui',
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: "StandaloneLayout"
            });
          };
          EOF
          cp openapi.json site/openapi.json

      # ===== PR 미리보기: gh-pages/docs/pr/<num> 경로로 배치 =====
      - name: Prepare PR preview under docs/pr/<num>
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.action != 'closed'
        run: |
          PREVIEW_DIR="pr-tmp/pr/${{ github.event.number }}"
          mkdir -p "$PREVIEW_DIR"
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -o /tmp/swagger-ui.zip
          unzip -q /tmp/swagger-ui.zip -d /tmp
          cp -r /tmp/swagger-ui-master/dist/* "$PREVIEW_DIR"/
          rm -rf /tmp/swagger-ui-master /tmp/swagger-ui.zip
          cat > "$PREVIEW_DIR/swagger-initializer.js" << 'EOF'
          window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: "./openapi.json",
              dom_id: '#swagger-ui',
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: "StandaloneLayout"
            });
          };
          EOF
          cp openapi.json "$PREVIEW_DIR/openapi.json"

      # ===== 메인 사이트를 gh-pages 루트에 커밋 =====
      - name: Push main site to gh-pages (/docs)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: docs        # ✅ 여기만 변경
          keep_files: true
          enable_jekyll: false

      # ===== PR 미리보기를 gh-pages/docs/pr/<num>에 커밋 =====
      - name: Push PR preview to gh-pages (docs/pr/<num>)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.action != 'closed'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pr-tmp/pr/${{ github.event.number }}     # ← 이 폴더를
          destination_dir: docs/pr/${{ github.event.number }}    # ← 여기에 ‘직접’ 배포
          keep_files: true
          enable_jekyll: false
          force_orphan: false

  # PR 닫히면 해당 미리보기만 제거
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove docs/pr/<num> and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "docs/pr/${{ github.event.number }}"
          git add -A
          git commit -m "chore: remove PR preview for #${{ github.event.number }}" || echo "Nothing to commit"
          git push
