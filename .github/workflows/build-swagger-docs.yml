name: Build Swagger Docs

on:
  push:
    branches: ["main"]          # main에 push될 때 => build + deploy
  pull_request:
    branches: ["main"]          # PR 열릴 때 => build + preview 배포
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  APP_MODULE: app.main:app
  SUPPRESS_VARIABLE_NOT_ASSIGNED_ERROR: "true"

jobs:
  build:
    # PR closed(정리)일 땐 별도 cleanup 잡이 실행되므로 build는 건너뜀
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export openapi.json (no server)
        run: |
          python scripts/export_openapi.py $APP_MODULE

      # ✅ main에 push될 때 정식 문서(/docs) 생성
      - name: Prepare Swagger UI under /docs (main site)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/docs
          cd docs/docs
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -o swagger-ui.zip
          unzip -q swagger-ui.zip
          cp -r swagger-ui-master/dist/* .
          rm -rf swagger-ui-master swagger-ui.zip
          cat > swagger-initializer.js << 'EOF'
          window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: "./openapi.json",        // ✅ petstore 제거
              dom_id: '#swagger-ui',
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: "StandaloneLayout"
            });
          };
          EOF
          cd ../..
          cp openapi.json docs/docs/openapi.json

      # ✅ PR일 때: /docs/pr/<번호> 폴더에 미리보기 UI 생성
      - name: Prepare PR preview under /docs/pr/<num>
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.action != 'closed'
        run: |
          PREVIEW_DIR="pr-tmp/docs/pr/${{ github.event.number }}"
          mkdir -p "$PREVIEW_DIR"
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -o /tmp/swagger-ui.zip
          unzip -q /tmp/swagger-ui.zip -d /tmp
          cp -r /tmp/swagger-ui-master/dist/* "$PREVIEW_DIR"/
          rm -rf /tmp/swagger-ui-master /tmp/swagger-ui.zip
          cat > "$PREVIEW_DIR/swagger-initializer.js" << 'EOF'
          window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: "./openapi.json",        // ✅ PR 프리뷰도 petstore 제거
              dom_id: '#swagger-ui',
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: "StandaloneLayout"
            });
          };
          EOF
          cp openapi.json "$PREVIEW_DIR/openapi.json"

      # ✅ main push 시 Pages artifact 업로드
      - name: Upload Pages artifact (main deploy)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # ✅ PR일 때는 gh-pages 브랜치에 부분 커밋 (keep_files)
      - name: Push PR preview to gh-pages (keep_files)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.action != 'closed'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pr-tmp
          destination_dir: docs         # ✅ /docs/pr/<num> 아래로 통합 관리
          keep_files: true
          enable_jekyll: false           # ✅ Jekyll 무효화 (폴더 무시 방지)

  # ✅ main push일 때만 정식 배포 (→ /docs)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          destination_dir: docs          # ✅ 루트 대신 /docs 에 배포

  # ✅ PR 닫히면 해당 PR 폴더만 gh-pages에서 삭제
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove docs/pr/<num> and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "docs/pr/${{ github.event.number }}"
          git add -A
          git commit -m "chore: remove PR preview for #${{ github.event.number }}" || echo "Nothing to commit"
          git push
