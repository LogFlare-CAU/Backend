name: OpenAPI JSON Store

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "openapi-jsons"
  cancel-in-progress: true

env:
  APP_MODULE: app.main:app
  SUPPRESS_VARIABLE_NOT_ASSIGNED_ERROR: "true"

jobs:
  # main → openapi-jsons 브랜치 루트에 openapi.json 갱신
  main-openapi:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export openapi.json
        run: |
          python scripts/export_openapi.py $APP_MODULE

      - name: Prepare publish dir
        run: |
          mkdir -p out
          cp openapi.json out/openapi.json

      - name: Publish to openapi-jsons (root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          publish_branch: openapi-jsons
          destination_dir: .
          keep_files: true
          enable_jekyll: false
          force_orphan: false

  # PR 열림/업데이트 시 → openapi-jsons/pr/<num>/openapi.json 저장
  pr-openapi:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export openapi.json
        run: |
          python scripts/export_openapi.py $APP_MODULE

      - name: Prepare publish dir
        run: |
          mkdir -p out/pr/${{ github.event.number }}
          cp openapi.json out/pr/${{ github.event.number }}/openapi.json

      - name: Publish PR openapi.json to openapi-jsons/pr/<num>
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          publish_branch: openapi-jsons
          destination_dir: .
          keep_files: true
          enable_jekyll: false
          force_orphan: false

      - name: Comment Swagger viewer link
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.number }}
          body: |
            🧩 **Swagger Preview**
            - Main spec: `https://raw.githubusercontent.com/${{ github.repository }}/openapi-jsons/openapi.json`
            - This PR spec: `https://raw.githubusercontent.com/${{ github.repository }}/openapi-jsons/pr/${{ github.event.number }}/openapi.json`
            - Viewer:
              - Main: (메인은 여기에서)[https://macqueen0987.github.io/swagger-viewer/?spec=https://raw.githubusercontent.com/${{ github.repository }}/openapi-jsons/openapi.json]
              - This PR: (이 PR은 여기에서)[https://macqueen0987.github.io/swagger-viewer/?spec=https://raw.githubusercontent.com/${{ github.repository }}/openapi-jsons/pr/${{ github.event.number }}/openapi.json]

