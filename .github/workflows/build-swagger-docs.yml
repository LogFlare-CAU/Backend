name: Build Swagger Docs (gh-pages branch)

on:
  push:
    branches: ["main"]   # main → 정식 문서 배포(/docs)
  pull_request:
    branches: ["main"]   # PR → openapi.json만 업로드(/docs/pr/<num>/openapi.json)
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  APP_MODULE: app.main:app
  SUPPRESS_VARIABLE_NOT_ASSIGNED_ERROR: "true"

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export openapi.json (no server)
        run: |
          python scripts/export_openapi.py $APP_MODULE

      # ===== 메인: /docs에 Swagger UI + openapi.json 배포 =====
      - name: Prepare Swagger UI (main site)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -o /tmp/swagger-ui.zip
          unzip -q /tmp/swagger-ui.zip -d /tmp
          cp -r /tmp/swagger-ui-master/dist/* site/
          rm -rf /tmp/swagger-ui-master /tmp/swagger-ui.zip
          cat > site/swagger-initializer.js << 'EOF'
          window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: "./openapi.json",
              dom_id: '#swagger-ui',
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: "StandaloneLayout"
            });
          };
          EOF
          cp openapi.json site/openapi.json

      - name: Push main site to gh-pages (/docs)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: docs
          keep_files: true
          enable_jekyll: false
          force_orphan: false   # ← 중요: orphan 금지

      # ===== PR: openapi.json만 /docs/pr/<num>/ 에 배포 =====
      - name: Stage PR openapi.json
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.action != 'closed'
        run: |
          mkdir -p pr-json
          cp openapi.json pr-json/openapi.json

      - name: Push PR openapi.json to gh-pages (docs/pr/<num>)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.action != 'closed'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pr-json
          destination_dir: docs/pr/${{ github.event.number }}
          keep_files: true
          enable_jekyll: false
          force_orphan: false   # ← 중요: orphan 금지

  # PR 닫히면 해당 PR 폴더 삭제
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove docs/pr/<num> and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "docs/pr/${{ github.event.number }}"
          git add -A
          git commit -m "chore: remove PR preview for #${{ github.event.number }}" || echo "Nothing to commit"
          git push
