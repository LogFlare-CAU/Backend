name: Build Swagger Docs

on:
  push:
    branches: ["main"]          # main에 push될 때 => build + deploy
  pull_request:
    branches: ["main"]          # PR 열릴 때 => build만

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  APP_MODULE: app.main:app
  SUPPRESS_VARIABLE_NOT_ASSIGNED_ERROR: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            **/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export openapi.json (no server)
        run: |
          python scripts/export_openapi.py $APP_MODULE

      - name: Prepare Swagger UI under /docs
        run: |
          mkdir -p docs/docs
          cd docs/docs
          curl -L https://github.com/swagger-api/swagger-ui/archive/refs/heads/master.zip -o swagger-ui.zip
          unzip -q swagger-ui.zip
          cp -r swagger-ui-master/dist/* .
          rm -rf swagger-ui-master swagger-ui.zip
          cat > swagger-initializer.js << 'EOF'
          window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: "./openapi.json",
              dom_id: '#swagger-ui',
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: "StandaloneLayout"
            });
          };
          EOF
          grep -q "./openapi.json" swagger-initializer.js || (echo "initializer 교체 실패" && exit 1)
          cd ../..
          cp openapi.json docs/docs/openapi.json

      # 아티팩트 업로드는 배포 때만 필요
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
