<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogFlare</title>
<!-- kit 링크는 아래 <style> 보다 먼저 로드한다(kit AGENTS.md §0). accent 는 --kit-accent 로 주입한다(§6.1). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://kit.code0987.me/v1/app.css">
<style>:root{--kit-accent:oklch(0.780 0.135 240)}</style>
<style>
@layer base { body { margin:0; background:var(--color-bg); color:var(--color-text); font-family:"Segoe UI","Apple SD Gothic Neo",sans-serif; line-height:1.5 } }
main { max-width:960px; margin:0 auto; padding:16px; box-sizing:border-box }
h1 { font-size:1.25rem; margin:0 0 12px }
[hidden] { display:none !important }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px }
.bar .grow { flex:1 1 auto }
.login { display:flex; flex-direction:column; gap:8px; max-width:320px; margin:48px auto }
.g { border-bottom:1px solid var(--color-border); padding:10px 0 }
.g:last-child { border-bottom:0 }
.g-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:.85rem; color:var(--color-muted) }
.g-top .cnt { margin-left:auto; font-variant-numeric:tabular-nums; color:var(--color-text) }
.g-msg { display:block; width:100%; margin:4px 0 0; padding:0; border:0; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer; overflow-wrap:anywhere; word-break:break-word }
.g-msg:focus-visible { outline:2px solid var(--color-accent); outline-offset:2px; border-radius:4px }
.g.ign .g-msg { opacity:.5 }
.detail { margin-top:8px; cursor:default }
.detail pre { margin:6px 0 0; padding:8px; background:var(--color-surface-2); border-radius:6px; white-space:pre-wrap; overflow-wrap:anywhere; overflow-x:auto; max-width:100%; box-sizing:border-box; font-size:.8rem }
.detail .t { font-size:.75rem; color:var(--color-muted); margin-top:8px }
.err { color:var(--color-danger) }
dialog#qrd { max-width:min(92vw,420px); border:1px solid var(--color-border); border-radius:12px; background:var(--color-bg); color:var(--color-text); padding:16px }
#qrbox svg { display:block; width:100%; height:auto; max-width:320px; margin:8px auto }
.warn { color:var(--color-danger); margin:6px 0 }
.tab[aria-pressed=true] { background:var(--color-accent); color:var(--color-on-accent) }
</style>
</head>
<body>
<main>
<h1>LogFlare</h1>

<div id="lnote" class="login" hidden></div>

<form id="login" class="login" hidden>
  <input class="input" id="u" placeholder="아이디" autocomplete="username" required>
  <input class="input" id="p" type="password" placeholder="비밀번호" autocomplete="current-password" required>
  <label class="check-row"><input type="checkbox" id="keep"> 로그인 유지</label>
  <button class="btn btn-primary" type="submit">로그인</button>
  <div id="lerr" class="err"></div>
</form>

<section id="app" hidden>
  <div class="bar">
    <button class="btn btn-ghost tab" data-sort="new" aria-pressed="true">새로 생긴 순</button>
    <button class="btn btn-ghost tab" data-sort="count" aria-pressed="false">많이 난 순</button>
    <select class="select" id="proj" aria-label="컨테이너"><option value="">모든 컨테이너</option></select>
    <label class="check-row"><input type="checkbox" id="ign"> 무시한 것도 보기</label>
    <span class="grow"></span>
    <button class="btn btn-ghost" id="qrb" hidden>Access QR</button>
    <button class="btn btn-ghost" id="out">로그아웃</button>
  </div>
  <div id="list"></div>
  <div class="bar"><button class="btn btn-ghost" id="more" hidden>더 보기</button></div>
  <div id="msg" class="err"></div>
</section>
<dialog id="qrd" aria-label="Access 로그인 QR">
  <div id="qrbox"></div>
  <div id="qrinfo" class="t"></div>
  <div id="qrwarn" class="warn"></div>
  <div class="bar"><button class="btn btn-ghost" id="qrx" type="button">닫기</button></div>
</dialog>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const base = location.pathname.replace(/[^/]*$/, '');
  const PAGE = 50;
  let sort = 'new', offset = 0, seq = 0;

  const store = {
    get() { try { return sessionStorage.getItem('lf_jwt') } catch { return null } },
    set(v) { try { v ? sessionStorage.setItem('lf_jwt', v) : sessionStorage.removeItem('lf_jwt') } catch {} },
  };

  class AuthError extends Error {}
  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json' };
    const t = store.get();
    if (t) headers.Authorization = 'Bearer ' + t;
    const r = await fetch(base + path, { ...opts, headers });
    if ((r.status === 400 || r.status === 401) && path !== 'user/auth') throw new AuthError();
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.message || j.detail || ('HTTP ' + r.status)); e.status = r.status; e.data = j.data; throw e; }
    return j.data;
  }

  let qrSeq = 0;
  function closeQr() { qrSeq++; const d = $('qrd'); if (d.open) d.close(); $('qrbox').replaceChildren(); $('qrinfo').textContent = ''; $('qrwarn').textContent = ''; }
  function showLogin() { closeQr(); $('qrb').hidden = true; store.set(null); seq++; $('list').replaceChildren(); $('proj').length = 1; $('more').hidden = true; $('app').hidden = true; renderLogin(); }

  // 로그인 화면은 서버가 허용하는 방식(GET /user/auth/modes)을 읽은 뒤에 보인다. 읽기에 실패하면 예전처럼 폼을 보인다.
  // 웹에는 CF Access 로그인 버튼이 없다 (브라우저는 서비스 토큰을 보낼 수 없다).
  let loginSeq = 0;
  async function renderLogin() {
    const my = ++loginSeq;
    $('login').hidden = true; $('lnote').hidden = true;
    let modes = null;
    try { const d = await api('user/auth/modes'); if (d && Array.isArray(d.modes)) modes = d.modes; } catch {}
    if (my !== loginSeq || !$('app').hidden) return;
    if (modes === null || modes.includes('password')) { $('login').hidden = false; return; }
    $('lnote').textContent = modes.length
      ? '이 서버는 비밀번호 로그인을 쓰지 않아요. 앱의 CF Access 모드로 로그인하세요.'
      : '이 서버는 로그인 방식이 꺼져 있어요. 관리자에게 LOGFLARE_AUTH_MODES 를 확인해 달라고 하세요.';
    $('lnote').hidden = false;
  }
  function showApp() { $('login').hidden = true; $('app').hidden = false; }
  async function guard(fn) {
    try { await fn(); $('msg').textContent = ''; }
    catch (e) { if (e instanceof AuthError) showLogin(); else $('msg').textContent = e.message; }
  }

  function rel(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
    if (Number.isNaN(s)) return '-';
    if (s < 60) return '방금';
    if (s < 3600) return Math.floor(s / 60) + '분 전';
    if (s < 86400) return Math.floor(s / 3600) + '시간 전';
    return Math.floor(s / 86400) + '일 전';
  }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const firstLine = s => (s || '').split('\n')[0];

  // 행 = 정보 줄(무시 버튼) + 메시지 버튼. 버튼 안에 버튼을 두지 않아 Enter·Space 가 기본 동작으로 된다.
  function row(g) {
    const d = el('div', 'g' + (g.ignored ? ' ign' : ''));
    const top = el('div', 'g-top');
    top.append(el('span', null, g.project_name), el('span', 'badge badge-warn', g.level),
      el('span', null, rel(g.last_seen)), el('span', 'cnt', g.count + '회'));
    const tog = el('button', 'btn btn-ghost', g.ignored ? '무시 해제' : '무시');
    tog.onclick = () => guard(async () => {
      await api('group/' + g.id, { method: 'PATCH', body: JSON.stringify({ ignored: !g.ignored }) });
      await load(true);
    });
    top.append(tog);
    const msg = el('button', 'g-msg', g.headline || firstLine(g.sample));
    msg.type = 'button';
    msg.setAttribute('aria-expanded', 'false');
    d.append(top, msg);
    let det = null;
    msg.onclick = () => {
      if (det) { det.remove(); det = null; msg.setAttribute('aria-expanded', 'false'); return; }
      det = el('div', 'detail', '불러오는 중…');
      msg.setAttribute('aria-expanded', 'true');
      d.append(det);
      guard(async () => {
        const full = await api('group/' + g.id);
        det.replaceChildren();
        if (!full.recent.length) det.append(el('div', 't', '최근 기록 없음'));
        for (const r of full.recent) {
          det.append(el('div', 't', new Date(r.timestamp).toLocaleString('ko-KR') + ' · ' + r.level), el('pre', null, r.message));
        }
      });
    };
    return d;
  }

  async function load(reset) {
    if (!reset && $('more').hidden) return;
    const my = ++seq;
    $('more').hidden = true;
    if (reset) offset = 0;
    const q = new URLSearchParams({ sort, limit: PAGE, offset, include_ignored: $('ign').checked });
    if ($('proj').value) q.set('project_id', $('proj').value);
    let items;
    try { items = await api('group?' + q); }
    catch (e) {
      // 새로 불러오기(정렬·필터 변경)에 실패하면 이전 조건의 목록을 남기지 않는다 — 다른 조건 결과로 오해한다.
      if (my === seq) { if (reset) { $('list').replaceChildren(); offset = 0; } else $('more').hidden = false; }
      throw e;
    }
    if (my !== seq) return;
    if (reset) $('list').replaceChildren();
    for (const g of items) $('list').append(row(g));
    offset += items.length;
    $('more').hidden = items.length < PAGE;
    if (!offset) $('list').append(el('div', 'empty', '묶음이 없습니다'));
  }

  // 관리자(permission 100)에게만 버튼을 보인다. 서버도 403 으로 막는다. 실패하면 그냥 숨긴 채 둔다.
  async function showQrButton() {
    try { const me = await api('user/me'); $('qrb').hidden = me.permission !== 100; }
    catch (e) { if (e instanceof AuthError) showLogin(); }
  }

  // 서버가 준 SVG 문자열은 innerHTML 이 아니라 DOMParser 로 파싱해 svg 요소만 가져온다.
  const SVG_NS = 'http://www.w3.org/2000/svg';
  function safeSvg(root, doc) {
    if (!root || root.localName !== 'svg' || root.namespaceURI !== SVG_NS || doc.getElementsByTagName('parsererror').length) return false;
    for (const n of [root, ...root.querySelectorAll('*')]) {
      if (n.namespaceURI !== SVG_NS || /^(script|foreignobject)$/i.test(n.localName)) return false;
      for (const a of n.attributes) {
        if (/^on/i.test(a.name)) return false;
        if (/^(href|xlink:href)$/i.test(a.name) && /^\s*javascript:/i.test(a.value)) return false;
      }
    }
    return true;
  }

  async function openQr() {
    const my = ++qrSeq;
    $('qrbox').replaceChildren(); $('qrinfo').textContent = ''; $('qrwarn').textContent = '';
    if (!$('qrd').open) $('qrd').showModal();
    try {
      const d = await api('user/access-qr');
      if (my !== qrSeq || !$('qrd').open) return;
      const doc = new DOMParser().parseFromString(d.svg, 'image/svg+xml');
      const root = doc.documentElement;
      if (!safeSvg(root, doc)) throw new Error('QR 을 표시할 수 없습니다');
      $('qrbox').append(document.importNode(root, true));
      $('qrinfo').textContent = d.server + ' · ' + d.clientId;
      const w = [];
      if (!d.mapped) w.push('이 토큰이 LogFlare 사용자에 연결되어 있지 않아 앱으로 찍어도 로그인되지 않습니다' + (d.mappedReason ? ' (' + d.mappedReason + ')' : '') + '.');
      if (!d.accessEnabled) w.push('Access 로그인이 꺼져 있어 앱으로 찍어도 로그인되지 않습니다.');
      $('qrwarn').textContent = w.join(' ');
    } catch (e) {
      if (my !== qrSeq || !$('qrd').open) return;
      if (e instanceof AuthError) return showLogin();
      const dd = e.data || {};
      if (e.status === 404 && dd.reason === 'qr_unconfigured') $('qrwarn').textContent = 'QR 기능이 꺼져 있습니다. 서버 설정이 빠졌습니다: ' + (dd.missing || []).join(', ');
      else if (e.status === 503) $('qrwarn').textContent = '서버에 QR 라이브러리가 없습니다.';
      else $('qrwarn').textContent = e.message;
    }
  }

  async function init() {
    showApp();
    showQrButton();
    // 컨테이너 목록을 못 불러와도 묶음 목록은 따로 불러온다.
    await guard(async () => {
      const ps = await api('project/');
      $('proj').length = 1;
      for (const p of ps) { const o = el('option', null, p.name); o.value = p.id; $('proj').append(o); }
    });
    if (!$('app').hidden) await guard(() => load(true));
  }

  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    sort = b.dataset.sort;
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', x === b));
    guard(() => load(true));
  });
  $('proj').onchange = $('ign').onchange = () => guard(() => load(true));
  $('more').onclick = () => guard(() => load(false));
  $('out').onclick = showLogin;
  $('qrb').onclick = openQr;
  $('qrx').onclick = closeQr;
  $('qrd').addEventListener('close', closeQr);
  $('login').onsubmit = async e => {
    e.preventDefault(); $('lerr').textContent = '';
    try {
      const jwt = await api('user/auth', { method: 'POST', body: JSON.stringify({ username: $('u').value, password: $('p').value, keep_logged_in: $('keep').checked }) });
      store.set(jwt); $('p').value = ''; init();
    } catch (err) { $('lerr').textContent = err.status === 404 ? '비밀번호 로그인이 꺼져 있어요' : (err.message || '로그인 실패'); }
  };

  store.get() ? init() : showLogin();
})();
</script>
</body>
</html>
