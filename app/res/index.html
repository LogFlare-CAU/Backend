<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogFlare</title>
<!-- kit 링크는 아래 <style> 보다 먼저 로드한다(kit AGENTS.md §0). accent 는 --kit-accent 로 주입한다(§6.1). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://kit.code0987.me/v1/app.css">
<style>:root{--kit-accent:oklch(0.780 0.135 240)}</style>
<style>
@layer base { body { margin:0; background:var(--color-bg); color:var(--color-text); font-family:"Segoe UI","Apple SD Gothic Neo",sans-serif; line-height:1.5 } }
main { max-width:960px; margin:0 auto; padding:16px; box-sizing:border-box }
h1 { font-size:1.25rem; margin:0 0 12px }
[hidden] { display:none !important }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px }
.bar .grow { flex:1 1 auto }
.login { display:flex; flex-direction:column; gap:8px; max-width:320px; margin:48px auto }
.g { border-bottom:1px solid var(--color-border); padding:10px 0; cursor:pointer }
.g:last-child { border-bottom:0 }
.g-top { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:.85rem; color:var(--color-muted) }
.g-top .cnt { margin-left:auto; font-variant-numeric:tabular-nums; color:var(--color-text) }
.g-msg { margin:4px 0 0; overflow-wrap:anywhere; word-break:break-word }
.g.ign .g-msg { opacity:.5 }
.detail { margin-top:8px; cursor:default }
.detail pre { margin:6px 0 0; padding:8px; background:var(--color-surface-2); border-radius:6px; white-space:pre-wrap; overflow-wrap:anywhere; overflow-x:auto; max-width:100%; box-sizing:border-box; font-size:.8rem }
.detail .t { font-size:.75rem; color:var(--color-muted); margin-top:8px }
.err { color:var(--color-danger) }
.tab[aria-pressed=true] { background:var(--color-accent); color:var(--color-on-accent) }
</style>
</head>
<body>
<main>
<h1>LogFlare</h1>

<form id="login" class="login" hidden>
  <input class="input" id="u" placeholder="아이디" autocomplete="username" required>
  <input class="input" id="p" type="password" placeholder="비밀번호" autocomplete="current-password" required>
  <label class="check-row"><input type="checkbox" id="keep"> 로그인 유지</label>
  <button class="btn btn-primary" type="submit">로그인</button>
  <div id="lerr" class="err"></div>
</form>

<section id="app" hidden>
  <div class="bar">
    <button class="btn btn-ghost tab" data-sort="new" aria-pressed="true">새로 생긴 순</button>
    <button class="btn btn-ghost tab" data-sort="count" aria-pressed="false">많이 난 순</button>
    <select class="select" id="proj" aria-label="컨테이너"><option value="">모든 컨테이너</option></select>
    <label class="check-row"><input type="checkbox" id="ign"> 무시한 것도 보기</label>
    <span class="grow"></span>
    <button class="btn btn-ghost" id="out">로그아웃</button>
  </div>
  <div id="list"></div>
  <div class="bar"><button class="btn btn-ghost" id="more" hidden>더 보기</button></div>
  <div id="msg" class="err"></div>
</section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const base = location.pathname.replace(/[^/]*$/, '');
  const PAGE = 50;
  let sort = 'new', offset = 0, seq = 0;

  const store = {
    get() { try { return sessionStorage.getItem('lf_jwt') } catch { return null } },
    set(v) { try { v ? sessionStorage.setItem('lf_jwt', v) : sessionStorage.removeItem('lf_jwt') } catch {} },
  };

  class AuthError extends Error {}
  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json' };
    const t = store.get();
    if (t) headers.Authorization = 'Bearer ' + t;
    const r = await fetch(base + path, { ...opts, headers });
    if ((r.status === 400 || r.status === 401) && path !== 'user/auth') throw new AuthError();
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || j.detail || ('HTTP ' + r.status));
    return j.data;
  }

  function showLogin() { store.set(null); seq++; $('list').replaceChildren(); $('proj').length = 1; $('more').hidden = true; $('app').hidden = true; $('login').hidden = false; }
  function showApp() { $('login').hidden = true; $('app').hidden = false; }
  async function guard(fn) {
    try { await fn(); $('msg').textContent = ''; }
    catch (e) { if (e instanceof AuthError) showLogin(); else $('msg').textContent = e.message; }
  }

  function rel(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
    if (Number.isNaN(s)) return '-';
    if (s < 60) return '방금';
    if (s < 3600) return Math.floor(s / 60) + '분 전';
    if (s < 86400) return Math.floor(s / 3600) + '시간 전';
    return Math.floor(s / 86400) + '일 전';
  }
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const firstLine = s => (s || '').split('\n')[0];

  function row(g) {
    const d = el('div', 'g' + (g.ignored ? ' ign' : ''));
    d.tabIndex = 0; d.setAttribute('role', 'button');
    d.onkeydown = e => { if (e.key === 'Enter' && e.target === d) d.onclick(); };
    const top = el('div', 'g-top');
    top.append(el('span', null, g.project_name), el('span', 'badge badge-warn', g.level),
      el('span', null, rel(g.last_seen)), el('span', 'cnt', g.count + '회'));
    const tog = el('button', 'btn btn-ghost', g.ignored ? '무시 해제' : '무시');
    tog.onclick = ev => { ev.stopPropagation(); guard(async () => {
      await api('group/' + g.id, { method: 'PATCH', body: JSON.stringify({ ignored: !g.ignored }) });
      await load(true);
    }); };
    top.append(tog);
    d.append(top, el('p', 'g-msg', firstLine(g.sample)));
    let det = null;
    d.onclick = () => {
      if (det) { det.remove(); det = null; return; }
      det = el('div', 'detail', '불러오는 중…');
      det.onclick = e => e.stopPropagation();
      d.append(det);
      guard(async () => {
        const full = await api('group/' + g.id);
        det.replaceChildren();
        if (!full.recent.length) det.append(el('div', 't', '최근 기록 없음'));
        for (const r of full.recent) {
          det.append(el('div', 't', new Date(r.timestamp).toLocaleString('ko-KR') + ' · ' + r.level), el('pre', null, r.message));
        }
      });
    };
    return d;
  }

  async function load(reset) {
    const my = ++seq;
    if (reset) offset = 0;
    const q = new URLSearchParams({ sort, limit: PAGE, offset, include_ignored: $('ign').checked });
    if ($('proj').value) q.set('project_id', $('proj').value);
    const items = await api('group?' + q);
    if (my !== seq) return;
    if (reset) $('list').replaceChildren();
    for (const g of items) $('list').append(row(g));
    offset += items.length;
    $('more').hidden = items.length < PAGE;
    if (!offset) $('list').append(el('div', 'empty', '묶음이 없습니다'));
  }

  async function init() {
    showApp();
    await guard(async () => {
      const ps = await api('project/');
      $('proj').length = 1;
      for (const p of ps) { const o = el('option', null, p.name); o.value = p.id; $('proj').append(o); }
      await load(true);
    });
  }

  document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    sort = b.dataset.sort;
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', x === b));
    guard(() => load(true));
  });
  $('proj').onchange = $('ign').onchange = () => guard(() => load(true));
  $('more').onclick = () => guard(() => load(false));
  $('out').onclick = showLogin;
  $('login').onsubmit = async e => {
    e.preventDefault(); $('lerr').textContent = '';
    try {
      const jwt = await api('user/auth', { method: 'POST', body: JSON.stringify({ username: $('u').value, password: $('p').value, keep_logged_in: $('keep').checked }) });
      store.set(jwt); $('p').value = ''; init();
    } catch (err) { $('lerr').textContent = err.message || '로그인 실패'; }
  };

  store.get() ? init() : showLogin();
})();
</script>
</body>
</html>
